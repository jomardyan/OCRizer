name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python packaging/check_release.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, tests]
    uses: ./.github/workflows/build.yml

  github-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Add SHA-256 checksums
        working-directory: release-assets
        run: sha256sum -- *.whl *.tar.gz *.zip *.AppImage > SHA256SUMS.txt
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes

  pypi:
    needs: [build, github-release]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/ocrizer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish Python distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2

name: Build distributions

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python wheel and source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install 'build>=1.2' 'twine>=6'
      - name: Build wheel from the source distribution
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/pdfocr" --version
          "$RUNNER_TEMP/wheel-test/bin/python" -c 'from pathlib import Path; import ocrizer; assert Path(ocrizer.__file__).with_name("py.typed").is_file()'
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64 executables
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[gui,build]'
      - run: choco install tesseract --yes --no-progress
      - name: Build, bundle Tesseract, and smoke-test both executables
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executables
          path: dist/OCRizer-*-windows-x86_64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-pol tesseract-ocr-osd fonts-dejavu-core libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 desktop-file-utils
      - run: python -m pip install -e '.[gui,build]'
      - run: desktop-file-validate packaging/linux/ocrizer.desktop
      - name: Build AppImage with Tesseract, and smoke-test actual launcher
        run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/OCRizer-*-linux-x86_64.AppImage
          if-no-files-found: error
